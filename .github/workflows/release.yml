name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = (python -c "import src; print(src.__version__)").Trim()
          echo "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "Version resolved to: $v"

      - name: Smoke import
        shell: pwsh
        run: |
          python -c "import src; print('Nudge', src.__version__)"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean Nudge.spec

      - name: List PyInstaller output
        shell: pwsh
        run: |
          Get-ChildItem dist/Nudge | Select-Object Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-Command ISCC.exe).Source
          echo "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile installer
        shell: pwsh
        run: |
          & $env:ISCC installer.iss /DMyAppVersion=${{ steps.version.outputs.VERSION }}
          Get-ChildItem Output

      - name: Rename to a stable asset name
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $src = "Output\Nudge-Setup-$version.exe"
          $dst = "Nudge-Setup-$version.exe"
          Copy-Item -LiteralPath $src -Destination $dst -Force
          echo "ASSET=$dst" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-Item $dst

      - name: Zip raw distribution (advanced / portable users)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $zipName = "Nudge-$version-windows.zip"
          Compress-Archive -Path dist/Nudge/* -DestinationPath $zipName -Force
          echo "ZIP=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nudge-windows
          path: |
            ${{ env.ASSET }}
            ${{ env.ZIP }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Nudge-windows
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
