name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = (python -c "import src; print(src.__version__)").Trim()
          echo "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build with PyInstaller
        shell: pwsh
        run: pyinstaller --noconfirm --clean Nudge.spec

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-Command ISCC.exe).Source
          echo "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile installer
        shell: pwsh
        run: |
          & $env:ISCC installer.iss /DMyAppVersion=${{ steps.version.outputs.VERSION }}

      - name: Rename assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $src = "Output\Nudge-Setup-$version.exe"
          $dst = "Nudge-Setup-$version.exe"
          Copy-Item -LiteralPath $src -Destination $dst -Force
          echo "ASSET=$dst" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $zipName = "Nudge-$version-windows.zip"
          Compress-Archive -Path dist/Nudge/* -DestinationPath $zipName -Force
          echo "ZIP=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Nudge-windows
          path: |
            ${{ env.ASSET }}
            ${{ env.ZIP }}
          retention-days: 14

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          V=$(python -c "import src; print(src.__version__)")
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pip install PyQt6 pyinstaller certifi

      - name: Build .app
        run: |
          pyinstaller \
            --onefile --windowed --name Nudge \
            --icon icon.icns \
            --add-data "src:src" \
            --hidden-import "src.backend.crash_reporter" \
            --hidden-import "src.backend.timer_manager" \
            --hidden-import "src.backend.single_instance" \
            --hidden-import "src.os_layer.platform_utils" \
            --exclude-module winotify \
            main.py

      - name: Create DMG
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          hdiutil create \
            -volname "Nudge" \
            -srcfolder "dist/Nudge.app" \
            -ov -format UDZO \
            "Nudge-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Nudge-macOS
          path: Nudge-*.dmg
          retention-days: 14

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          V=$(python -c "import src; print(src.__version__)")
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 libxkbcommon-x11-0 libglib2.0-0 \
            libegl1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xkb1

      - name: Install Python deps
        run: pip install PyQt6 pyinstaller certifi

      - name: Build
        run: |
          pyinstaller \
            --onefile --windowed --name Nudge \
            --icon icon.png \
            --add-data "src:src" \
            --hidden-import "src.backend.crash_reporter" \
            --hidden-import "src.backend.timer_manager" \
            --hidden-import "src.backend.single_instance" \
            --hidden-import "src.os_layer.platform_utils" \
            --exclude-module winotify \
            main.py

      - name: Rename asset
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mv dist/Nudge "Nudge-$VERSION-linux"

      - uses: actions/upload-artifact@v4
        with:
          name: Nudge-Linux
          path: Nudge-*-linux
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/Nudge-windows/*
            artifacts/Nudge-macOS/*
            artifacts/Nudge-Linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
